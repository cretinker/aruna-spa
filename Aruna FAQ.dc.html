<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#F4EDE6; color:#1A1411; font-family:'DM Sans',sans-serif;">

  <div style="background:#1A1411; color:#FBF6F0; padding:126px 44px 96px; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:70px; align-items:end;">
    <div style="display:flex; flex-direction:column; gap:26px;">
      <div style="display:flex; align-items:center; gap:16px;">
        <div style="width:44px; height:1px; background:#D9A08C;"></div>
        <div style="font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:#D9A08C;">{{ ui.eyebrow }}</div>
      </div>
      <div style="font-family:'Libre Caslon Display',serif; font-size:clamp(46px,4.9vw,84px); line-height:.93; letter-spacing:-.035em;">{{ ui.h1a }}<br>{{ ui.h1b }} <span style="font-family:'Libre Caslon Text',serif; font-style:italic; color:#D9A08C;">{{ ui.h1c }}</span></div>
      <div style="font-size:18.5px; line-height:1.7; color:rgba(251,246,240,.76); max-width:540px;">{{ ui.sub }}</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:11px;">
      <div style="font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#D9A08C;">{{ ui.jumpT }}</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <sc-for list="{{ jumps }}" as="j" hint-placeholder-count="6">
          <div onClick="{{ j.click }}" style="border:1px solid {{ j.border }}; background:{{ j.bg }}; color:{{ j.fg }}; font-size:12.5px; padding:12px 18px; cursor:pointer;" style-hover="border-color:#D9A08C;">{{ j.label }}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div data-reveal style="padding:70px 44px 80px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
      <div style="padding-bottom:72px; display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:60px; align-items:start; border-bottom:1px solid rgba(26,20,17,.16); margin-bottom:56px;">
        <div style="display:flex; flex-direction:column; gap:12px; position:sticky; top:24px;">
          <div style="font-family:'Libre Caslon Display',serif; font-size:44px; line-height:1; letter-spacing:-.028em;">{{ g.title }}</div>
          <div style="font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#8A7A6E;">{{ g.count }}</div>
        </div>
        <div style="display:flex; flex-direction:column;">
          <sc-for list="{{ g.items }}" as="q" hint-placeholder-count="4">
            <div onClick="{{ q.click }}" style="border-top:1px solid rgba(26,20,17,.18); padding:22px 0; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) 28px; gap:20px; align-items:start;" style-hover="background:rgba(26,20,17,.02);">
              <div style="display:flex; flex-direction:column; gap:12px;">
                <div style="font-family:'Libre Caslon Display',serif; font-size:24px; line-height:1.24; color:{{ q.qColor }};">{{ q.q }}</div>
                <div style="font-size:16.5px; line-height:1.76; color:#3A312B; max-width:820px; display:{{ q.show }};">{{ q.a }}</div>
              </div>
              <div style="font-family:'Libre Caslon Display',serif; font-size:22px; line-height:1.1; color:#7C2D3A; text-align:right;">{{ q.mark }}</div>
            </div>
          </sc-for>
          <div style="border-top:1px solid rgba(26,20,17,.18);"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="background:#7C2D3A; color:#FBF6F0; padding:120px 44px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.9fr); gap:70px; align-items:center;">
    <div style="display:flex; flex-direction:column; gap:24px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:30px; height:1px; background:#E7C3B4;"></div>
        <div style="font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#E7C3B4;">{{ ui.ctaEyebrow }}</div>
      </div>
      <div style="font-family:'Libre Caslon Display',serif; font-size:clamp(42px,4.4vw,74px); line-height:.94; letter-spacing:-.034em;">{{ ui.ctaA }} <span style="font-family:'Libre Caslon Text',serif; font-style:italic; color:#E7C3B4;">{{ ui.ctaB }}</span></div>
      <div style="font-size:17px; line-height:1.68; color:rgba(251,246,240,.82); max-width:520px;">{{ ui.ctaSub }}</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:11px;">
      <div onClick="{{ goVisit }}" style="background:#FBF6F0; color:#7C2D3A; font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:21px 32px; cursor:pointer; text-align:center;" style-hover="background:#1A1411; color:#FBF6F0;">{{ ui.ctaAsk }}</div>
      <div onClick="{{ goBooking }}" style="border:1px solid rgba(251,246,240,.4); color:#FBF6F0; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; padding:21px 32px; cursor:pointer; text-align:center;" style-hover="border-color:#FBF6F0; background:rgba(251,246,240,.1);">{{ ui.ctaBook }}</div>
      <a href="tel:+17183546298" style="border:1px solid rgba(251,246,240,.4); color:#FBF6F0; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; padding:21px 32px; text-align:center;" style-hover="border-color:#FBF6F0; background:rgba(251,246,240,.1);">{{ ui.ctaCall }}</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1400, &quot;height&quot;: 900}, &quot;lang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;en&quot;, &quot;es&quot;], &quot;default&quot;: &quot;en&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onNav&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(page: string) =&gt; void&quot;}}">
const UI = {
  en: {
    eyebrow: 'Questions \u00b7 answered in full',
    h1a: 'Everything people', h1b: 'ask before', h1c: 'they commit.',
    sub: 'Prices, healing, preparation, policies and the awkward ones. All of it here rather than behind a phone call, because you should be able to decide before you speak to anyone.',
    jumpT: 'Jump to',
    ctaEyebrow: 'Still not answered',
    ctaA: 'Ask the one that', ctaB: 'is not on this page.',
    ctaSub: 'Aruna reads the questions herself, usually the same day. No deposit, no obligation, and if a treatment is wrong for your skin she will say so before it is booked.',
    ctaAsk: 'Ask a question', ctaBook: 'Book an appointment', ctaCall: 'Call 718 354 6298',
    groups: [
      ['Prices & paying', [
        ['Why are all the prices on the site?', 'Because a consultation whose real job is getting you through the door before anybody says a number is not a consultation. The list is public, the consultation is free, and the two have nothing to do with each other.'],
        ['Is cash really cheaper?', 'On every permanent-makeup service, yes, and both numbers are printed so you can compare. Nothing gets renegotiated when you arrive.'],
        ['Can I pay over time?', 'Any booking from $50 to $4,000 splits into four payments, approved in about a minute before your appointment. The studio adds nothing for paying this way.'],
        ['Is a deposit taken?', '$100 on the Beauty Nap and on new house-call clients, $60 on full body massage. Deposits come off the treatment price. They are not a booking fee.'],
        ['What if the work costs more than $4,000?', 'Full-head alopecia coverage runs to $4,500. The first $4,000 can be financed and the balance is spread across your sessions. Raise it at the consultation.']
      ]],
      ['Permanent makeup', [
        ['Which technique is right for me?', 'Microblading suits normal to dry skin and reads hair by hair. Powder holds better on oily and mature skin and reads as soft makeup. Nano combines both. The free consultation exists for exactly this.'],
        ['How long does it last?', 'Six to twenty-four months before a touch-up, and that range is decided by your skin, not the technique. Anyone quoting you a fixed number of years is selling.'],
        ['Is the touch-up really included?', 'Yes, four to six weeks after your first appointment, eight at the outside. Pigment settles unevenly on everybody, so one sitting was never the finished result.'],
        ['I already have brows I do not like.', 'Correction is possible and starts with a consultation to look at the existing pigment and shape. Reshaping existing clients\u2019 brows is $400.'],
        ['Will it look obviously done?', 'The shape is drawn and agreed with you before the first stroke. If it is not right at that stage, changing it costs nothing.']
      ]],
      ['Hair loss & scalp', [
        ['Who is scalp micropigmentation for?', 'Thinning at the part, a receding hairline, alopecia, or scar coverage \u2014 men and women. It gives the look of very short hair, placed pigment by pigment.'],
        ['Is it surgery?', 'No. Three hours in the chair, no recovery, nothing to take every morning, and back at work the same day.'],
        ['How long does it last?', 'Years, and it fades gradually rather than falling out. Touch-ups keep the density where you want it.'],
        ['Will it look like a tattoo?', 'Not at conversation distance, which is the only distance that matters. Density and colour are matched to your own hair and skin.']
      ]],
      ['Laser & skin', [
        ['How many laser sessions will I need?', 'Six to eight for underarms, six to ten for legs and bikini, eight to ten for a full face. Men need more sessions because the hair is denser.'],
        ['Why is laser sold by the course?', 'Almost nobody is clear in under six sessions, so selling them one at a time would be dishonest. From six, the whole plan drops 20%.'],
        ['Will a facial leave me red?', 'Any facial treatment can, and microneedling stays red for one to three days. Do not book it the week of an event.'],
        ['Which facial should I start with?', 'The $120 signature facial tells both of us how your skin responds. From there it is dermaplaning, hydrafacial or microneedling.']
      ]],
      ['Booking & the visit', [
        ['How far ahead should I book?', 'The calendar fills about three weeks out. Ten to twelve weeks for permanent makeup before a wedding, because of the touch-up timing.'],
        ['What are the hours?', 'Monday to Friday until 8pm, Saturday 1pm to 3pm only, Sunday closed. There is one chair, which is why the constraint is real.'],
        ['Is there a waiting room?', 'No. The studio is inside a home, so come on time rather than early, and ring the bell rather than waiting in the car.'],
        ['Do you speak Spanish?', 'Yes \u2014 consultations and treatments both run in English or Spanish.'],
        ['Do you travel to me?', 'House calls cover Long Island, New Jersey and Whitestone for groups of three or more, from $700, and they are permanent makeup only. Booked by text.']
      ]],
      ['Cancelling & changing', [
        ['What is the cancellation policy?', 'Move or cancel free up to 24 hours before. New brow and PMU clients: a $150 fee applies to no-shows and cancellations inside 24 hours.'],
        ['Why the fee?', 'One chair means an empty slot cannot be filled by someone else. Moving the appointment earlier costs nothing and takes five seconds.'],
        ['Can I bring someone with me?', 'The studio is a private room in a home with one client at a time. Ask when you book rather than arriving with company.']
      ]]
    ]
  },
  es: {
    eyebrow: 'Preguntas \u00b7 contestadas por completo',
    h1a: 'Todo lo que preguntan', h1b: 'antes de', h1c: 'decidirse.',
    sub: 'Precios, cicatrizaci\u00f3n, preparaci\u00f3n, pol\u00edticas y las preguntas inc\u00f3modas. Todo aqu\u00ed en lugar de detr\u00e1s de una llamada, porque deber\u00edas poder decidir antes de hablar con nadie.',
    jumpT: 'Ir a',
    ctaEyebrow: 'Si falta la tuya',
    ctaA: 'Haz la que no est\u00e1', ctaB: 'en esta p\u00e1gina.',
    ctaSub: 'Aruna lee las preguntas ella misma, normalmente el mismo d\u00eda. Sin dep\u00f3sito, sin compromiso, y si un tratamiento no le va bien a tu piel te lo dir\u00e1 antes de reservarlo.',
    ctaAsk: 'Hacer una pregunta', ctaBook: 'Reservar una cita', ctaCall: 'Llamar 718 354 6298',
    groups: [
      ['Precios y pagos', [
        ['\u00bfPor qu\u00e9 est\u00e1n todos los precios en la p\u00e1gina?', 'Porque una consulta cuyo verdadero trabajo es meterte por la puerta antes de que alguien diga un n\u00famero no es una consulta. La lista es p\u00fablica, la consulta es gratis, y las dos cosas no tienen relaci\u00f3n.'],
        ['\u00bfDe verdad es m\u00e1s barato en efectivo?', 'En cada servicio de maquillaje permanente, s\u00ed, y las dos cifras est\u00e1n por escrito para que compares. Nada se renegocia cuando llegas.'],
        ['\u00bfPuedo pagar a plazos?', 'Cualquier reserva de $50 a $4,000 se divide en cuatro pagos, aprobados en un minuto antes de tu cita. El estudio no a\u00f1ade nada por pagar as\u00ed.'],
        ['\u00bfSe cobra dep\u00f3sito?', '$100 en el Beauty Nap y en clientas nuevas a domicilio, $60 en masaje de cuerpo completo. Los dep\u00f3sitos se descuentan del precio. No son un cargo por reservar.'],
        ['\u00bfY si el trabajo cuesta m\u00e1s de $4,000?', 'La cobertura de cabeza completa por alopecia llega a $4,500. Los primeros $4,000 se pueden financiar y el resto se reparte entre tus sesiones. Menci\u00f3nalo en la consulta.']
      ]],
      ['Maquillaje permanente', [
        ['\u00bfQu\u00e9 t\u00e9cnica me conviene?', 'Microblading va bien en piel normal a seca y se ve pelo a pelo. Powder aguanta mejor en piel grasa y madura y se ve como maquillaje suave. Nano combina las dos. La consulta gratuita existe justo para esto.'],
        ['\u00bfCu\u00e1nto dura?', 'De seis a veinticuatro meses antes de un retoque, y ese rango lo decide tu piel, no la t\u00e9cnica. Quien te prometa un n\u00famero fijo de a\u00f1os te est\u00e1 vendiendo algo.'],
        ['\u00bfDe verdad va incluido el retoque?', 'S\u00ed, de cuatro a seis semanas despu\u00e9s de tu primera cita, ocho como m\u00e1ximo. El pigmento se asienta distinto en cada piel, as\u00ed que una sesi\u00f3n nunca fue el resultado final.'],
        ['Ya tengo cejas que no me gustan.', 'La correcci\u00f3n es posible y empieza con una consulta para ver el pigmento y la forma actuales. Rehacer cejas de clientas existentes cuesta $400.'],
        ['\u00bfSe va a notar mucho?', 'La forma se dibuja y se acuerda contigo antes del primer trazo. Si no est\u00e1 bien en esa etapa, cambiarla no cuesta nada.']
      ]],
      ['Ca\u00edda del cabello', [
        ['\u00bfPara qui\u00e9n es la micropigmentaci\u00f3n capilar?', 'Poca densidad en la raya, entradas, alopecia o cobertura de cicatrices, hombres y mujeres. Da el aspecto de cabello muy corto, colocado pigmento a pigmento.'],
        ['\u00bfEs cirug\u00eda?', 'No. Tres horas en la silla, sin recuperaci\u00f3n, sin nada que tomar cada ma\u00f1ana, y de vuelta al trabajo el mismo d\u00eda.'],
        ['\u00bfCu\u00e1nto dura?', 'A\u00f1os, y se desvanece poco a poco en lugar de caerse. Los retoques mantienen la densidad donde la quieres.'],
        ['\u00bfSe va a ver como un tatuaje?', 'No a distancia de conversaci\u00f3n, que es la \u00fanica que importa. La densidad y el color se ajustan a tu propio cabello y piel.']
      ]],
      ['L\u00e1ser y piel', [
        ['\u00bfCu\u00e1ntas sesiones de l\u00e1ser necesito?', 'Seis a ocho para axilas, seis a diez para piernas y bikini, ocho a diez para cara completa. Los hombres necesitan m\u00e1s porque el vello es m\u00e1s denso.'],
        ['\u00bfPor qu\u00e9 el l\u00e1ser se vende por plan?', 'Casi nadie queda limpia en menos de seis sesiones, as\u00ed que venderlas de una en una ser\u00eda deshonesto. Desde seis, todo el plan baja 20%.'],
        ['\u00bfUn facial me va a dejar roja?', 'Cualquier tratamiento facial puede, y el microneedling queda rojo de uno a tres d\u00edas. No lo reserves la semana de un evento.'],
        ['\u00bfPor qu\u00e9 facial empiezo?', 'El facial de firma de $120 nos dice a las dos c\u00f3mo responde tu piel. De ah\u00ed pasamos a dermaplaning, hydrafacial o microneedling.']
      ]],
      ['Reservas y la visita', [
        ['\u00bfCon cu\u00e1nta antelaci\u00f3n reservo?', 'La agenda se llena con unas tres semanas. De diez a doce semanas para maquillaje permanente antes de una boda, por el tiempo del retoque.'],
        ['\u00bfCu\u00e1l es el horario?', 'De lunes a viernes hasta las 8pm, s\u00e1bado solo de 1pm a 3pm, domingo cerrado. Hay una sola silla, por eso el l\u00edmite es real.'],
        ['\u00bfHay sala de espera?', 'No. El estudio est\u00e1 dentro de una casa, as\u00ed que llega a tu hora y no antes, y toca el timbre en lugar de esperar en el coche.'],
        ['\u00bfHablan espa\u00f1ol?', 'S\u00ed: las consultas y los tratamientos son en ingl\u00e9s o en espa\u00f1ol.'],
        ['\u00bfVan a mi casa?', 'Los domicilios cubren Long Island, Nueva Jersey y Whitestone para grupos de tres o m\u00e1s, desde $700, y son solo micropigmentaci\u00f3n. Se agenda por mensaje.']
      ]],
      ['Cancelar y cambiar', [
        ['\u00bfCu\u00e1l es la pol\u00edtica de cancelaci\u00f3n?', 'Cambia o cancela gratis hasta 24 horas antes. Clientas nuevas de cejas y PMU: $150 por ausencia o cancelaci\u00f3n con menos de 24 horas.'],
        ['\u00bfPor qu\u00e9 el cargo?', 'Una sola silla significa que un hueco vac\u00edo no lo puede tomar otra persona. Mover la cita antes no cuesta nada y toma cinco segundos.'],
        ['\u00bfPuedo llevar a alguien?', 'El estudio es una sala privada en una casa, con una clienta a la vez. Preg\u00fantalo al reservar en lugar de llegar acompa\u00f1ada.']
      ]]
    ]
  }
};

class Component extends DCLogic {
  state = { open: {}, group: null };

  componentDidMount() { window.scrollTo({ top: 0, behavior: 'auto' }); }

  nav = p => { const f = this.props.onNav; if (f) f(p); };

  toggle = key => this.setState(s => {
    const open = Object.assign({}, s.open);
    open[key] = !open[key];
    return { open: open };
  });

  renderVals() {
    const es = this.props.lang === 'es';
    const ui = UI[es ? 'es' : 'en'];
    const st = this.state;
    const filter = st.group;
    const nQ = es ? 'preguntas' : 'questions';

    const all = [{ label: es ? 'Todo' : 'Everything', k: null }]
      .concat(ui.groups.map(g => ({ label: g[0], k: g[0] })));

    return {
      ui,
      jumps: all.map(j => ({
        label: j.label,
        bg: filter === j.k ? '#D9A08C' : 'transparent',
        fg: filter === j.k ? '#1A1411' : 'rgba(251,246,240,.8)',
        border: filter === j.k ? '#D9A08C' : 'rgba(251,246,240,.3)',
        click: () => this.setState({ group: j.k })
      })),
      groups: ui.groups.filter(g => !filter || g[0] === filter).map(g => ({
        title: g[0],
        count: g[1].length + ' ' + nQ,
        items: g[1].map((q, i) => {
          const key = g[0] + i;
          const open = !!st.open[key];
          return {
            q: q[0], a: q[1],
            show: open ? 'block' : 'none',
            mark: open ? '\u2212' : '+',
            qColor: open ? '#7C2D3A' : '#1A1411',
            click: () => this.toggle(key)
          };
        })
      })),
      goVisit: () => this.nav('visit'),
      goBooking: () => this.nav('booking')
    };
  }
}

</script>
</body>
</html>
